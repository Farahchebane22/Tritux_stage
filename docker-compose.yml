version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: tritux-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tritux_db
      MYSQL_USER: tritux_user
      MYSQL_PASSWORD: tritux_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tritux-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-tritux-helpdesk.json:/opt/keycloak/data/import/realm-tritux-helpdesk.json

  ai-service:
    build:
      context: ./backend/ai-service
    container_name: tritux-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: tritux-user-service
    restart: always
    environment:
      PORT: 5001
      JWT_SECRET: tritux_secret_key_12345
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: tritux-helpdesk
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5001:5001"
    depends_on:
      mysql-db:
        condition: service_healthy

  ticket-service:
    build:
      context: ./backend
      dockerfile: ticket-service/Dockerfile
    container_name: tritux-ticket-service
    restart: always
    environment:
      PORT: 5002
      JWT_SECRET: tritux_secret_key_12345
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: tritux-helpdesk
      CONTRACT_SERVICE_URL: http://contract-service:5003
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5002:5002"
    depends_on:
      mysql-db:
        condition: service_healthy
      contract-service:
        condition: service_started

  contract-service:
    build:
      context: ./backend
      dockerfile: contract-service/Dockerfile
    container_name: tritux-contract-service
    restart: always
    environment:
      PORT: 5003
      JWT_SECRET: tritux_secret_key_12345
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: tritux-helpdesk
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5003:5003"
    depends_on:
      mysql-db:
        condition: service_healthy

  report-service:
    build:
      context: ./backend
      dockerfile: report-service/Dockerfile
    container_name: tritux-report-service
    restart: always
    environment:
      PORT: 5004
      JWT_SECRET: tritux_secret_key_12345
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: tritux-helpdesk
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5004:5004"
    depends_on:
      mysql-db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: tritux-api-gateway
    restart: always
    environment:
      PORT: 5000
      USER_SERVICE_URL: http://user-service:5001
      TICKET_SERVICE_URL: http://ticket-service:5002
      CONTRACT_SERVICE_URL: http://contract-service:5003
      REPORT_SERVICE_URL: http://report-service:5004
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - ticket-service
      - contract-service
      - report-service
      - ai-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_KEYCLOAK_ENABLED: "true"
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: tritux-helpdesk
        VITE_KEYCLOAK_CLIENT_ID: tritux-frontend
    container_name: tritux-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
      - keycloak

  landing:
    image: nginx:alpine
    container_name: tritux-landing
    ports:
      - "3000:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro

volumes:
  mysql-data:
