version: '3.8'

services:
  # 1. MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: tritux-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tritux_db
      MYSQL_USER: tritux_user
      MYSQL_PASSWORD: tritux_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. AI Assistant Service (FastAPI)
  ai-service:
    build:
      context: ./backend/ai-service
    container_name: tritux-ai-service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. User Service
  user-service:
    build:
      context: ./backend/user-service
    container_name: tritux-user-service
    restart: always
    environment:
      PORT: 5001
      JWT_SECRET: tritux_secret_key_12345
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5001:5001"
    depends_on:
      mysql-db:
        condition: service_healthy

  # 4. Ticket Service
  ticket-service:
    build:
      context: ./backend/ticket-service
    container_name: tritux-ticket-service
    restart: always
    environment:
      PORT: 5002
      JWT_SECRET: tritux_secret_key_12345
      DB_HOST: mysql-db
      DB_USER: tritux_user
      DB_PASSWORD: tritux_password
      DB_NAME: tritux_db
    ports:
      - "5002:5002"
    depends_on:
      mysql-db:
        condition: service_healthy

  # 5. API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: tritux-api-gateway
    restart: always
    environment:
      PORT: 5000
      USER_SERVICE_URL: http://user-service:5001
      TICKET_SERVICE_URL: http://ticket-service:5002
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - ticket-service
      - ai-service

  # 6. Frontend Web Application (Vue.js 3 + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: tritux-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
