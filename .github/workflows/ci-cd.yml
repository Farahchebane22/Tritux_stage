name: Tritux Ticketing Platform CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Continuous Integration (Lint, Typecheck, Build Test)
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  ci-backend-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Validate API Gateway
        run: |
          cd backend/api-gateway
          npm install

      - name: Validate User Service
        run: |
          cd backend/user-service
          npm install

      - name: Validate Ticket Service
        run: |
          cd backend/ticket-service
          npm install

      - name: Validate Contract Service
        run: |
          cd backend/contract-service
          npm install

      - name: Validate Report Service
        run: |
          cd backend/report-service
          npm install

  ci-python-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Validate AI Service Requirements
        run: |
          cd backend/ai-service
          pip install -r requirements.txt

  # 2. Build & Push Docker Images to Docker Hub
  # Nécessite 2 secrets GitHub (Settings > Secrets and variables > Actions) :
  #   DOCKERHUB_USERNAME = ton nom d'utilisateur Docker Hub
  #   DOCKERHUB_TOKEN    = un Access Token Docker Hub (PAS ton mot de passe —
  #                        généré sur hub.docker.com > Account Settings > Security)
  docker-build-push:
    needs: [ci-frontend, ci-backend-services, ci-python-ai]
    runs-on: ubuntu-latest
    # Ne pousse réellement les images que sur main/master (une PR ne fait que builder,
    # pas pousser — évite de polluer Docker Hub avec des images de branches de test).
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-frontend:latest

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-api-gateway:latest

      # Les 4 services ci-dessous partagent backend/shared/auth.js : le contexte
      # de build DOIT être ./backend (pas leur sous-dossier), sinon COPY échoue.
      - name: Build & Push User Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/user-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-user-service:latest

      - name: Build & Push Ticket Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/ticket-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-ticket-service:latest

      - name: Build & Push Contract Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/contract-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-contract-service:latest

      - name: Build & Push Report Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/report-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-report-service:latest

      - name: Build & Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-ai-service:latest

      - name: Build & Push Keycloak Image (realm pré-importé)
        uses: docker/build-push-action@v5
        with:
          context: ./keycloak
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tritux-keycloak:latest

  # 3. Déploiement continu sur Azure Container Apps.
  # Met à jour les Container Apps EXISTANTES avec la dernière image poussée.
  # Ne crée RIEN : les apps doivent d'abord exister (voir docs/azure-deployment.md,
  # script de provisionnement initial à lancer une seule fois à la main).
  # Nécessite le secret GitHub AZURE_CREDENTIALS (JSON d'un service principal,
  # voir docs/azure-deployment.md §2).
  deploy-azure:
    needs: docker-build-push
    if: github.event_name == 'push' && secrets.AZURE_CREDENTIALS != ''
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API Gateway
        run: |
          az containerapp update \
            --name tritux-gateway \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-api-gateway:latest

      - name: Deploy User Service
        run: |
          az containerapp update \
            --name tritux-user-svc \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-user-service:latest

      - name: Deploy Ticket Service
        run: |
          az containerapp update \
            --name tritux-ticket-svc \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-ticket-service:latest

      - name: Deploy Contract Service
        run: |
          az containerapp update \
            --name tritux-contract-svc \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-contract-service:latest

      - name: Deploy Report Service
        run: |
          az containerapp update \
            --name tritux-report-svc \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-report-service:latest

      - name: Deploy AI Service
        run: |
          az containerapp update \
            --name tritux-ai-svc \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-ai-service:latest

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name tritux-frontend \
            --resource-group tritux-rg \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tritux-frontend:latest
